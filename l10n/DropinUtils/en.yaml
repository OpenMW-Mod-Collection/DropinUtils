page_name: Drop-in Utils Demo
page_desc: Live showcase of every renderer and utility in Bor's Drop-in Utils.

group_presets_name: Presets
preset_name: Preset
preset_desc: Applies a bundle of values to the demo settings. See presetManager.lua.

group_renderers_name: Renderers
toggles_name: MultiCheckbox
toggles_desc: "Packs an arbitrary number of labeled checkboxes into one setting, storing the results as a table of booleans."
soundOn: Sound
questMarkers: Quest Markers
particlesOn: Particles
multiTextLine_name: MultiInput (text mode)
multiTextLine_desc: "Groups multiple labeled single-line text fields into one setting, making it easy to keep related strings together."
greeting: Greeting
farewell: Farewell
multiNumber_name: MultiInput (number mode)
multiNumber_desc: "Groups multiple labeled numeric fields into one setting, with optional per-field minimum and maximum limits."
volume: Volume
radius: Radius
textSet_name: Text Set
textSet_desc: "Maintains a free-form set of strings as a lookup table, such as a list of record IDs."
twoColumnSet_name: Two Column Set
twoColumnSet_desc: "Keeps two sets of strings in one table: left-column entries are true, right-column entries are false. Left-click moves an entry, right-click removes it."
orderList_name: Order List
orderList_desc: "Lets the player reorder a list of entries with buttons and supports locked separators."
time_name: Time
time_desc: "Inputs a time value as days, hours, minutes and seconds, then stores the result in seconds."

